<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>AI Chat Tool - Claude</title>
 <style>
:root {
 --primary-color: #6366f1;
 --secondary-color: #4f46e5;
 --bg-color: #f3f4f6;
 --chat-bg: #ffffff;
 --text-color: #1f2937;
 --user-msg-bg: #6366f1;
 --ai-msg-bg: #e5e7eb;
 --input-bg: #f9fafb;
 --border-color: #e5e7eb;
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 }

 body {
 background-color: var(--bg-color);
 color: var(--text-color);
 height: 100vh;
 display: flex;
 flex-direction: column;
 overflow: hidden;
 }

.container {
 max-width: 900px;
 width: 100%;
 margin: 0 auto;
 display: flex;
 flex-direction: column;
 height: 100%;
 background-color: var(--chat-bg);
 box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
 }

 /* Header */
 header {
 padding: 15px 20px;
 border-bottom: 1px solid var(--border-color);
 display: flex;
 justify-content: space-between;
 align-items: center;
 background-color: #fff;
 }

.header-title {
 font-size: 1.25rem;
 font-weight: 600;
 color: var(--secondary-color);
 }

.status-badge {
 font-size: 0.75rem;
 padding: 4px 8px;
 border-radius: 12px;
 background-color: #d1fae5;
 color: #065f46;
 display: flex;
 align-items: center;
 gap: 5px;
 }

.status-dot {
 width: 8px;
 height: 8px;
 background-color: #10b981;
 border-radius: 50%;
 animation: pulse 2s infinite;
 }

 @keyframes pulse {
 0% { opacity: 1; }
 50% { opacity: 0.5; }
 100% { opacity: 1; }
 }

 /* Chat Area */
.chat-area {
 flex: 1;
 overflow-y: auto;
 padding: 20px;
 display: flex;
 flex-direction: column;
 gap: 15px;
 scroll-behavior: smooth;
 }

.message {
 max-width: 80%;
 padding: 12px 16px;
 border-radius: 12px;
 line-height: 1.5;
 word-wrap: break-word;
 font-size: 0.95rem;
 animation: slideIn 0.3s ease-out;
 }

 @keyframes slideIn {
 from { opacity: 0; transform: translateY(10px); }
 to { opacity: 1; transform: translateY(0); }
 }

.message.user {
 align-self: flex-end;
 background-color: var(--user-msg-bg);
 color: #fff;
 border-bottom-right-radius: 2px;
 }

.message.ai {
 align-self: flex-start;
 background-color: var(--ai-msg-bg);
 color: var(--text-color);
 border-bottom-left-radius: 2px;
 }

.message.error {
 align-self: center;
 background-color: #fee2e2;
 color: #991b1b;
 border: 1px solid #fca5a5;
 }

 /* Input Area */
.input-area {
 padding: 20px;
 border-top: 1px solid var(--border-color);
 display: flex;
 flex-direction: column;
 gap: 15px;
 background-color: #fff;
 }

.controls {
 display: flex;
 gap: 10px;
 flex-wrap: wrap;
 }

 select, input[type="text"] {
 padding: 10px 14px;
 border: 1px solid var(--border-color);
 border-radius: 8px;
 font-size: 0.9rem;
 background-color: var(--input-bg);
 color: var(--text-color);
 outline: none;
 transition: border-color 0.2s;
 }

 select:focus, input[type="text"]:focus {
 border-color: var(--primary-color);
 box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
 }

.input-wrapper {
 display: flex;
 gap: 10px;
 position: relative;
 }

.input-wrapper input {
 flex: 1;
 padding: 12px 16px;
 border: 1px solid var(--border-color);
 border-radius: 8px;
 font-size: 1rem;
 outline: none;
 resize: none;
 min-height: 50px;
 max-height: 150px;
 overflow-y: auto;
 background-color: var(--input-bg);
 }

.input-wrapper input:focus {
 border-color: var(--primary-color);
 box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
 }

 button {
 padding: 12px 24px;
 border: none;
 border-radius: 8px;
 background-color: var(--primary-color);
 color: white;
 font-size: 1rem;
 font-weight: 500;
 cursor: pointer;
 transition: background-color 0.2s, transform 0.1s;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 8px;
 }

 button:hover {
 background-color: var(--secondary-color);
 }

 button:active {
 transform: scale(0.98);
 }

 button:disabled {
 background-color: #9ca3af;
 cursor: not-allowed;
 transform: none;
 }

 /* Loading Indicator */
.loading {
 display: flex;
 align-items: center;
 gap: 5px;
 font-size: 0.85rem;
 color: #6b7280;
 margin-left: 10px;
 }

.loading-spinner {
 width: 16px;
 height: 16px;
 border: 2px solid #d1d5db;
 border-top-color: var(--primary-color);
 border-radius: 50%;
 animation: spin 1s linear infinite;
 }

 @keyframes spin {
 to { transform: rotate(360deg); }
 }

 /* Mobile Responsive */
 @media (max-width: 768px) {
.container {
 margin: 0;
 border-radius: 0;
 height: 100vh;
 }

.message {
 max-width: 90%;
 }

.controls {
 flex-direction: column;
 }

 select, input[type="text"] {
 width: 100%;
 }
 }
 </style>
</head>
<body>
 <div class="container">
 <header>
 <div class="header-title">AI Chat Tool</div>
 <div class="status-badge">
 <div class="status-dot"></div>
 <span>Ready</span>
 </div>
 </header>

 <div class="chat-area" id="chat-area">
 <div class="message ai">Hello! How can I help you today? I'm ready to respond using the selected AI model.</div>
 </div>

 <div class="input-area">
 <div class="controls">
 <select id="model-select">
 <option value="opus-4-8">Claude Opus 4.8</option>
 </select>
 </div>

 <div class="input-wrapper">
 <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
 <button id="send-btn" onclick="sendMessage()">
 <span>Send</span>
 </button>
 </div>
 </div>
 </div>

 <script>
 const chatArea = document.getElementById('chat-area');
 const userInput = document.getElementById('user-input');
 const sendBtn = document.getElementById('send-btn');
 const modelSelect = document.getElementById('model-select');

 // Function to add a message to the chat
 function addMessage(text, sender) {
 const msgDiv = document.createElement('div');
 msgDiv.classList.add('message', sender);
 msgDiv.textContent = text;
 chatArea.appendChild(msgDiv);
 chatArea.scrollTop = chatchatArea.scrollHeight;
 }

 // Function to add an error message
 function addErrorMessage(text) {
 const msgDiv = document.createElement('div');
 msgDiv.classList.add('message', 'error');
 msgDiv.textContent = text;
 chatArea.appendChild(msgDiv);
 }

 // Function to show loading state
 function showLoading() {
 const loadingDiv = document.createElement('div');
 loadingDiv.classList.add('message', 'ai');
 loadingDiv.id = 'loading-msg';
 loadingDiv.innerHTML = '<div class="loading"><div class="loading-spinner"></div> Thinking...</div>';
 chatArea.appendChild(loadingDiv);
 chatArea.scrollTop = chatArea.scrollHeight;
 }

 // Main function to send message
 async function sendMessage() {
 const message = userInput.value.trim();
 const model = modelSelect.value;

 if (!message) {
 userInput.focus();
 return;
 }

 // Clear previous loading state if exists
 const loadingMsg = document.getElementById('loading-msg');
 if (loadingMsg) {
 loadingMsg.remove();
 }

 // Show user message and loading indicator
 addMessage(message, 'user');
 userInput.value = '';
 showLoading();
 sendBtn.disabled = true;

 try {
 // The API URL format
 const apiUrl = `https://zellrayy.com/ai/claude?q=${encodeURIComponent(message)}&model=${encodeURIComponent(model)}`;

 // Fetch data from API
 const response = await fetch(apiUrl);

 if (!response.ok) {
 throw new Error(`HTTP error! status: ${response.status}`);
 }

 const data = await response.json();

 if (data.status && data.result) {
 // Remove loading indicator and show AI response
 const loadingMsg = document.getElementById('loading-msg');
 if (loadingMsg) {
 loadingMsg.remove();
 }
 addMessage(data.result, 'ai');
 } else {
 throw new Error('Invalid response format');
 }

 } catch (error) {
 // Remove loading indicator and show error
 const loadingMsg = document.getElementById('loading-msg');
 if (loadingMsg) {
 loadingMsg.remove();
 }
 addErrorMessage(`Error: ${error.message}`);
 } finally {
 sendBtn.disabled = false;
 userInput.focus();
 }
 }

 // Handle Enter key to send
 userInput.addEventListener('keydown', (e) => {
 if (e.key === 'Enter' && !e.shiftKey) {
 e.preventDefault();
 sendMessage();
 }
 });
 </script>
</body>
</html>
